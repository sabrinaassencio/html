    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — Class e ID</title>
  <link rel ="stylesheet" href = "style.css"
</head>
<body>

  <main>

        <h1>🍦 Sabores do Dia</h1>

        <!-- CLASSE + ID -->
        <div class="card" id="promo-dia">
            <h4>Oferta Especial</h4>
            <p>Casquinha com 2 sabores por apenas R$ 8,00</p>
        </div>

        <!-- SÓ A CLASSE BASE -->
        <div class="card">
            <h4>Baunilha</h4>
            <p>Delicioso e cremoso sorvete de baunilha. R$ 6,00</p>
        </div>

        <!-- DUAS CLASSES: card + destaque -->
        <div class="card destaque">
            <h4>Chocolate Belga</h4>
            <p>Um dos favoritos dos nossos clientes. R$ 8,00</p>
        </div>

        <!-- DUAS CLASSES: card + esgotado -->
        <div class="card esgotado">
            <h4>Frutas Vermelhas</h4>
            <p>Temporariamente indisponível. R$ 7,50</p>
        </div>

    </main>

</body>
</html>

</body>
</html>
